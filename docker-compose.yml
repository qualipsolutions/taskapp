version: '3.8'

services:
  taskapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    volumes:
      # Optional: Mount a volume for logs or persistent data
      - ./logs:/app/logs
    restart: unless-stopped
    container_name: taskapp-container

networks:
  default:
    name: taskapp-network